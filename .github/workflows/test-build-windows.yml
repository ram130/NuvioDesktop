name: Test Build Windows MSI

on:
  workflow_dispatch:
    inputs:
      pr:
        description: NuvioMedia/NuvioDesktop PR number to build
        required: true
        default: "945"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 MSI for PR ${{ inputs.pr }}
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44

    steps:
      - name: Check out PR source
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioDesktop
          ref: refs/pull/${{ inputs.pr }}/head
          lfs: false

      - name: Fetch Windows runtime
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if (( $(wc -c < "${runtime_path}") < 1000000 )); then
            echo "The bundled Windows libmpv runtime was not materialized from Git LFS." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create empty local.properties
        shell: bash
        run: touch local.properties

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache
          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-pr-${{ inputs.pr }}-windows-x64
          path: composeApp/build/compose/**/*.msi
          if-no-files-found: error
          retention-days: 14
